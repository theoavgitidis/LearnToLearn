name: macOS App
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test learning core
        run: swift test
      - name: Build native app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LearnToLearn-macOS
          path: dist/LearnToLearn-macOS.zip
